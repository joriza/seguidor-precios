name: Keystore bootstrap

# Genera UNA VEZ el keystore de firma debug y lo sube como artefacto para
# committearlo al repo (v0.1.1, S3): con firma estable, los APK futuros se
# instalan encima sin desinstalar. El keystore es de prueba (pass "android"),
# no es un secreto: el release público de Play Store usará otro flujo.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Seguidor de Precios,C=AR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: debug-keystore
          path: debug.keystore
