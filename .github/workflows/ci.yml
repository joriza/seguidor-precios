name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Test
        run: flutter test
        working-directory: app

      - name: Build APK (debug) — evidencia mínima del target Android (S5)
        run: flutter build apk --debug
        working-directory: app
